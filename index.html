<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHP Login System - Preview</title>
    <!-- Tailwind CSS for Modern UI/UX -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-indigo-900 via-slate-900 to-black min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-8 text-white"
    >
      <!-- App Header -->
      <div class="text-center mb-8">
        <h1
          class="text-3xl font-extrabold tracking-wide bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent"
        >
          SecurePortal
        </h1>
        <p class="text-gray-300 text-sm mt-1">PHP Login System UI Preview</p>
      </div>

      <!-- Alert Message Box -->
      <div
        id="alertBox"
        class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"
      ></div>

      <!-- Toggle Tabs -->
      <div class="flex bg-white/5 p-1 rounded-xl mb-6 border border-white/10">
        <button
          id="tabLogin"
          onclick="switchTab('login')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-md"
        >
          Login
        </button>
        <button
          id="tabRegister"
          onclick="switchTab('register')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all"
        >
          Register
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label
            class="block text-xs uppercase tracking-wider text-gray-400 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="loginEmail"
            required
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
            placeholder="name@example.com"
          />
        </div>
        <div>
          <label
            class="block text-xs uppercase tracking-wider text-gray-400 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="loginPassword"
            required
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-indigo-500 to-pink-500 hover:from-indigo-600 hover:to-pink-600 font-semibold rounded-xl shadow-lg transition-all transform active:scale-95"
        >
          Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form
        id="registerForm"
        onsubmit="handleRegister(event)"
        class="space-y-4 hidden"
      >
        <div>
          <label
            class="block text-xs uppercase tracking-wider text-gray-400 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="regName"
            required
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
            placeholder="John Doe"
          />
        </div>
        <div>
          <label
            class="block text-xs uppercase tracking-wider text-gray-400 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="regEmail"
            required
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
            placeholder="name@example.com"
          />
        </div>
        <div>
          <label
            class="block text-xs uppercase tracking-wider text-gray-400 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="regPassword"
            required
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-pink-500 to-indigo-500 hover:from-pink-600 hover:to-indigo-600 font-semibold rounded-xl shadow-lg transition-all transform active:scale-95"
        >
          Create Account
        </button>
      </form>

      <!-- Dashboard View (Hidden by default) -->
      <div id="dashboardView" class="hidden text-center space-y-4">
        <div
          class="w-16 h-16 bg-gradient-to-tr from-green-400 to-indigo-500 rounded-full mx-auto flex items-center justify-center text-2xl font-bold shadow-lg"
        >
          👋
        </div>
        <h2 id="welcomeUser" class="text-2xl font-bold">Welcome back!</h2>
        <p class="text-gray-300 text-sm">
          You have successfully logged into your account dashboard simulation.
        </p>
        <button
          onclick="handleLogout()"
          class="w-full py-3 bg-red-500/20 border border-red-500/40 hover:bg-red-500/30 text-red-300 font-semibold rounded-xl transition-all"
        >
          Sign Out
        </button>
      </div>
    </div>

    <!-- JavaScript for Interactive UI Simulation -->
    <script>
      function switchTab(tab) {
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const tabLogin = document.getElementById("tabLogin");
        const tabRegister = document.getElementById("tabRegister");
        hideAlert();

        if (tab === "login") {
          loginForm.classList.remove("hidden");
          registerForm.classList.add("hidden");
          tabLogin.className =
            "flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-md";
          tabRegister.className =
            "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
        } else {
          loginForm.classList.add("hidden");
          registerForm.classList.remove("hidden");
          tabRegister.className =
            "flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-md";
          tabLogin.className =
            "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
        }
      }

      function showAlert(message, isSuccess = false) {
        const alertBox = document.getElementById("alertBox");
        alertBox.textContent = message;
        alertBox.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium ${isSuccess ? "bg-green-500/20 border border-green-500/40 text-green-300" : "bg-red-500/20 border border-red-500/40 text-red-300"}`;
      }

      function hideAlert() {
        document.getElementById("alertBox").classList.add("hidden");
      }

      function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById("regName").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;

        localStorage.setItem(
          "demoUser",
          JSON.stringify({ name, email, password }),
        );
        showAlert("Registration successful! Please login.", true);
        switchTab("login");
      }

      function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        const savedUser = JSON.parse(localStorage.getItem("demoUser"));

        if (
          savedUser &&
          savedUser.email === email &&
          savedUser.password === password
        ) {
          showDashboard(savedUser.name);
        } else {
          showAlert("Invalid email or password. (Try registering first!)");
        }
      }

      function showDashboard(name) {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("registerForm").classList.add("hidden");
        document.querySelector(".flex.bg-white\\/5").classList.add("hidden");
        document.getElementById("welcomeUser").textContent =
          `Welcome, ${name}!`;
        document.getElementById("dashboardView").classList.remove("hidden");
        hideAlert();
      }

      function handleLogout() {
        document.getElementById("dashboardView").classList.add("hidden");
        document.querySelector(".flex.bg-white\\/5").classList.remove("hidden");
        switchTab("login");
        showAlert("Logged out successfully.", true);
      }
    </script>
  </body>
</html>
